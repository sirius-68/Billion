services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: billion
      POSTGRES_PASSWORD: billion
      POSTGRES_DB: billion
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billion"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
